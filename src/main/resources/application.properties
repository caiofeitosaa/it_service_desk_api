spring.application.name=it_service_desk_api

spring.datasource.url=jdbc:mysql://localhost:3306/it_service_desk_api?createDatabaseIfNotExist=true

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# JWT signing secret must be provided as an environment variable with at least 32 characters.
api.security.token.secret=${JWT_SECRET}
# Access tokens are valid for one hour.
api.security.token.expiration-seconds=3600
